name: Portable tests and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-python312.txt
      - name: Install isolated test environment
        run: python -m pip install -c constraints-python312.txt -e ".[dev]"
      - name: Verify resolution
        run: python -m pip check
      - name: Python contracts and offline flows
        run: python scripts/check_project.py --python-only
      - name: Build explicit distributable archives
        run: python -m build --no-isolation
      - name: Check archives contain only source and required resources
        run: python scripts/check_package.py dist
      - name: Install and smoke test wheel outside checkout
        run: python scripts/check_installed.py dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-checks-${{ matrix.os }}
          path: out/verification/python-tests.xml
          if-no-files-found: ignore

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: replay_tool/go.mod
          cache-dependency-path: replay_tool/go.sum
      - name: Verify pinned module source
        working-directory: replay_tool
        run: go mod verify
      - name: Extractor tests
        working-directory: replay_tool
        run: go test -mod=readonly ./...
      - name: Extractor compile
        working-directory: replay_tool
        run: go build -mod=readonly ./...
